name: Release APK
on:
  push:
    branches: [main]
    paths:
      - '.github/release-version'
      - 'app/src/main/res/**'
      - 'index.html'
      - 'app.js'
      - 'engine.js'
      - 'styles.css'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested release version
        id: version
        shell: python
        run: |
          import os, pathlib, re
          requested = pathlib.Path('.github/release-version').read_text().strip()
          configured = re.search(r'versionName = "([^"]+)"', pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', requested) or requested != configured:
              raise SystemExit('Release marker must match Android versionName')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={requested}\n')
      - name: Check signing configuration
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing signing secret: $name"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/engine.test.cjs
      - name: Build minified release
        run: gradle :app:assembleRelease --no-daemon
      - name: Sign release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "::error::Signing secrets required. No debug APK will be published."; exit 1; }
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.jks
          ${ANDROID_HOME}/build-tools/35.0.0/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner sign --ks release.jks --ks-pass env:SIGNING_STORE_PASSWORD --ks-key-alias "$SIGNING_KEY_ALIAS" --key-pass env:SIGNING_KEY_PASSWORD --out "YT-DLP-Command-Builder-v${RELEASE_VERSION}.apk" aligned.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose "YT-DLP-Command-Builder-v${RELEASE_VERSION}.apk"
          rm -f release.jks aligned.apk
      - name: Enable KVM for signed APK launch check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch signed and minified APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/release-smoke.sh
      - name: Keep signed APK and launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ steps.version.outputs.version }}
          path: |
            YT-DLP-Command-Builder-v*.apk
            release-ui*.xml
            release-screen.png
            release-logcat.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${RELEASE_VERSION}" "YT-DLP-Command-Builder-v${RELEASE_VERSION}.apk" --clobber
            gh release edit "v${RELEASE_VERSION}" --notes-file .github/release-notes.md
          else
            gh release create "v${RELEASE_VERSION}" "YT-DLP-Command-Builder-v${RELEASE_VERSION}.apk" --target "$GITHUB_SHA" --title "YT-DLP Command Builder v${RELEASE_VERSION}" --notes-file .github/release-notes.md --latest
          fi
